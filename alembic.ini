[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
# DSN is injected from src.config.settings by alembic/env.py — leave blank here
# so the DSN lives in one place (environment variables).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
