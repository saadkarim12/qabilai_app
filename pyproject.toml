[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kabil-backend"
version = "0.1.0"
description = "Kabil.ai — AI-driven hiring automation backend"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Kabil.ai" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "sse-starlette>=2.1,<3.0",  # Server-Sent Events transport for the realtime HR event stream.
    "uvicorn[standard]>=0.32,<1.0",
    "python-multipart>=0.0.18,<1.0",  # Required by FastAPI for multipart/form-data parsing (Step 3.8).
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "pgvector>=0.3,<1.0",
    "pydantic[email]>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "celery>=5.4,<6.0",
    "redis>=5.2,<6.0",
    "httpx>=0.27,<1.0",
    "aiosmtplib>=3.0,<4.0",  # Async SMTP transport for transactional email (Step 6.4 interview invites).
    "jinja2>=3.1,<4.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "bcrypt>=4.2,<5.0",
    "pypdf>=5.1,<6.0",
    "phonenumbers>=8.13,<9.0",
    "langdetect>=1.0.9,<2.0",
    "langchain-core>=0.3,<1.0",
    "langchain-anthropic>=0.3,<1.0",
    "langchain-postgres>=0.0.12,<1.0",
    "langgraph>=0.2,<1.0",
    "anthropic>=0.40,<1.0",
    "openai>=1.55,<2.0",
    "tiktoken>=0.8,<1.0",
    "bleach>=6.1,<7.0",
    "pycountry>=24.6,<25.0",
    "azure-storage-blob>=12.24,<13.0",
    "aiohttp>=3.10,<4.0",  # Required by azure.storage.blob.aio as its async HTTP transport.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "N",     # pep8-naming
    "ASYNC", # flake8-async
    "S",     # bandit security
    "RUF",   # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107"]
"scripts/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires the dev Postgres + Redis containers running",
]
